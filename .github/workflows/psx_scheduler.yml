# Force scheduler sync
name: PSX Scheduled Price Alerts

on:
  schedule:
    # ================= MONDAY TO THURSDAY =================
    # 09:33 & 09:45 PKT (04:33 & 04:45 UTC)
    - cron: '33,45 4 * * 1-4'

    # 10:00, 10:30, 11:00, 11:30, 12:00, 12:30 PKT (05:00 to 07:30 UTC)
    - cron: '0,30 5,6,7 * * 1-4'

    # 13:30, 14:00, 14:30, 15:00 PKT (08:30, 09:00, 09:30, 10:00 UTC)
    - cron: '30 8 * * 1-4'
    - cron: '0,30 9 * * 1-4'
    - cron: '0 10 * * 1-4'

    # 15:15, 15:25, 15:35 PKT (10:15, 10:25, 10:35 UTC)
    - cron: '15,25,35 10 * * 1-4'

    # ===================== FRIDAY =====================
    # Friday Session 1: 09:18, 10:00, 10:30, 11:00, 11:55 PKT
    - cron: '18 4 * * 5'
    - cron: '0,30 5 * * 5'
    - cron: '0 6 * * 5'
    - cron: '55 6 * * 5'

    # Friday Session 2: 14:35, 15:00, 15:30, 16:00, 16:35 PKT
    - cron: '35 9 * * 5'
    - cron: '0,30 10 * * 5'
    - cron: '0 11 * * 5'
    - cron: '35 11 * * 5'

  workflow_dispatch:

jobs:
  check-psx-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Direct Ping Test to Phone
        run: |
          # Sends an instant test ping from GitHub runner directly to ntfy
          curl -H "Title: GitHub Runner Connected" \
               -H "Priority: 4" \
               -d "GitHub Actions runner is alive and executing your alert script." \
               https://ntfy.sh/Khan_PSX_Alerts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Alert Runner
        run: |
          python psx_runner.py
